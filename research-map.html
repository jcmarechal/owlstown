<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Sites – Jean-Christophe Maréchal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3cXqvQ5v0G0VQfQ9R8xQ6j8m5mQ9E=" crossorigin="">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
#research-map{width:100%;height:700px;min-height:500px;border-radius:12px;overflow:hidden}
.site-popup h3{margin:0 0 6px;font-size:16px}
.site-popup p{margin:0 0 8px;line-height:1.4}
.site-popup a{font-weight:600;text-decoration:none}
.map-legend{background:rgba(255,255,255,.95);padding:10px 12px;line-height:1.45;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.25);font-size:13px}
.map-legend strong{display:block;margin-bottom:4px}
@media(max-width:700px){#research-map{height:560px}}
</style>
</head>
<body>
<div id="research-map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const sites = [
    {
      name: 'Vise & Thau',
      country: 'France',
      lat: 43.444,
      lon: 3.663,
      description: 'Karst spring and saltwater intrusion / inversac system.',
      url: 'https://marechal.owlstown.net/pages/10148'
    },
    {
      name: 'Lez',
      country: 'France',
      lat: 43.695,
      lon: 3.848,
      description: 'Hydrogeological investigations and modelling of the Lez karst system.',
      url: 'https://marechal.owlstown.net/pages/10076'
    },
    {
      name: 'Fontaine de Nîmes',
      country: 'France',
      lat: 43.835,
      lon: 4.36,
      description: 'Karst hydrogeology of the Fontaine de Nîmes system.',
      url: 'https://marechal.owlstown.net/pages/10064'
    },
    {
      name: 'Mont-Blanc Tunnel',
      country: 'Alps, France–Italy',
      lat: 45.9,
      lon: 6.87,
      description: 'Groundwater flow, thermal anomalies and tunnel inflows in fractured crystalline rocks.',
      url: 'https://marechal.owlstown.net/pages/10144'
    },
    {
      name: 'Plateau de Sault',
      country: 'France',
      lat: 42.83,
      lon: 2.0,
      description: 'Hydrogeological research in a karstic and fractured mountain environment.',
      url: 'https://marechal.owlstown.net/pages/10288'
    },
    {
      name: 'Maheshwaram',
      country: 'India',
      lat: 17.2,
      lon: 78.43,
      description: 'Hard-rock aquifer functioning, weathered mantle and fractured crystalline bedrock.',
      url: 'https://marechal.owlstown.net/pages/10073'
    },
    {
      name: 'Mule Hole',
      country: 'India',
      lat: 11.98,
      lon: 76.62,
      description: 'Hydrogeological research on groundwater flow and recharge in crystalline rocks.',
      url: 'https://marechal.owlstown.net/pages/10074'
    },
    {
      name: 'Choutuppal',
      country: 'India',
      lat: 17.25,
      lon: 78.9,
      description: 'Hard-rock aquifer research and groundwater recharge.',
      url: 'https://marechal.owlstown.net/pages/10146'
    },
    {
      name: 'Nsimi',
      country: 'Cameroon',
      lat: 3.2,
      lon: 11.75,
      description: 'Hydrogeological research on groundwater–surface water interactions and recharge.',
      url: 'https://marechal.owlstown.net/pages/10147'
    }
];

const map = L.map("research-map", {scrollWheelZoom:false, worldCopyJump:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:18,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const bounds = [];
sites.forEach(site => {
  const marker = L.marker([site.lat,site.lon]).addTo(map);
  marker.bindPopup(`
    <div class="site-popup">
      <h3>${site.name}</h3>
      <p><strong>${site.country}</strong></p>
      <p>${site.description}</p>
      <a href="${site.url}" target="_blank" rel="noopener noreferrer">View case study →</a>
    </div>
  `);
  bounds.push([site.lat,site.lon]);
});
map.fitBounds(bounds, {padding:[35,35]});

const legend = L.control({position:"bottomright"});
legend.onAdd = function() {
  const div = L.DomUtil.create("div","map-legend");
  div.innerHTML = "<strong>Selected research sites</strong>Click a marker to open the case study.";
  return div;
};
legend.addTo(map);
setTimeout(() => map.invalidateSize(), 300);
</script>
</body>
</html>
