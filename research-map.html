<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jean-Christophe Maréchal — Research sites</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif}#map{width:100%;height:560px;border-radius:12px;overflow:hidden}.legend{background:white;padding:10px 12px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.25);line-height:20px;font-size:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}.popup-title{font-weight:700;font-size:15px;margin-bottom:5px}.popup-category{font-size:12px;font-weight:600;margin-bottom:7px}.popup-text{font-size:13px;line-height:1.45;max-width:270px}.popup-link{display:inline-block;margin-top:9px;font-size:12px;font-weight:600}.featured{font-weight:700}@media (max-width:700px){#map{height:480px}}</style></head>
<body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const sites=[
{name:"Vise submarine spring — Thau Lagoon",lat:43.443489,lon:3.671810,category:"Coastal karst",color:"#2b83ba",featured:true,text:"A natural laboratory for coastal karst hydrogeology, including groundwater flow reversal, saltwater intrusion and freshwater–seawater interactions.",url:"https://marechal.owlstown.net/projects/5944"},
{name:"Lez karst system",lat:43.7100,lon:3.8600,category:"Karst aquifer",color:"#4daf4a",text:"Study of groundwater resources, flow dynamics and management in a Mediterranean karst aquifer.",url:"https://marechal.owlstown.net/pages/10030"},
{name:"Plateau de Sault karst",lat:42.8085,lon:2.0042,category:"Karst aquifer",color:"#4daf4a",text:"Study of groundwater resources and hydrogeological functioning in a Pyrenean mountainous karst system.",url:"https://marechal.owlstown.net/pages/10030"},
{name:"Fontaine de Nîmes karst system",lat:43.8367,lon:4.3601,category:"Karst aquifer",color:"#4daf4a",text:"Study of groundwater dynamics and flood processes in a Mediterranean karst system.",url:"https://marechal.owlstown.net/pages/10030"},
{name:"Mont-Blanc Massif",lat:45.832627,lon:6.864717,category:"Mountain groundwater",color:"#555555",text:"Study of groundwater flow, temperature and deep hydrogeological processes in fractured crystalline rocks of the Alps.",url:"https://marechal.owlstown.net/pages/10030"},
{name:"Mule Hole forest watershed — India",lat:11.733333,lon:76.450000,category:"Fractured-rock aquifer",color:"#a65628",text:"Study of weathering processes, groundwater storage and chemical budgets in a crystalline aquifer under tropical conditions.",url:"https://marechal.owlstown.net/pages/10030"},
{name:"Maheshwaram irrigated basin — India",lat:17.134188,lon:78.433449,category:"Fractured-rock aquifer",color:"#a65628",text:"Study of groundwater flow and storage in a crystalline-rock aquifer under semi-arid conditions and water scarcity.",url:"https://marechal.owlstown.net/pages/10030"}];
const map=L.map("map",{scrollWheelZoom:false});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
function markerIcon(s){const z=s.featured?20:14;return L.divIcon({className:"",html:`<div style="width:${z}px;height:${z}px;background:${s.color};border:${s.featured?3:2}px solid white;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);"></div>`,iconSize:[z,z],iconAnchor:[z/2,z/2],popupAnchor:[0,-z/2]})}
const bounds=[];sites.forEach(s=>{const m=L.marker([s.lat,s.lon],{icon:markerIcon(s)}).addTo(map);m.bindPopup(`<div class="popup-title">${s.name}${s.featured?' <span class="featured">★</span>':''}</div><div class="popup-category">${s.category}</div><div class="popup-text">${s.text}</div><a class="popup-link" href="${s.url}" target="_blank" rel="noopener">View research site →</a>`);bounds.push([s.lat,s.lon])});map.fitBounds(bounds,{padding:[35,35]});
const legend=L.control({position:"bottomright"});legend.onAdd=function(){const d=L.DomUtil.create("div","legend");d.innerHTML='<b>Research sites</b><br><i style="background:#a65628"></i>Fractured-rock aquifer<br><i style="background:#4daf4a"></i>Karst aquifer<br><i style="background:#2b83ba"></i>Coastal karst<br><i style="background:#555"></i>Mountain groundwater';return d};legend.addTo(map);map.once("click",()=>map.scrollWheelZoom.enable());
</script></body></html>
